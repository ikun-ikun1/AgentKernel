[alembic]
script_location = migrations
prepend_sys_path = src
# DSN 来自环境变量 AGENTKERNEL_DB_URL（G-06：此处不留任何口令）
sqlalchemy.url = mysql+pymysql://agentkernel@127.0.0.1:3306/agentkernel

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
