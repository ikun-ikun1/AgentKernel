[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkernel"
version = "0.1.0"
description = "从零实现的 Agent 内核 + 知识库 MCP 工具（不依赖任何 Agent 框架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",              # DeepSeek（OpenAI 兼容）—— M1 核心
  "python-dotenv>=1.0",       # .env —— M1 核心
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.4",            # 向量库 —— M2
  "sentence-transformers>=2.2",  # bge-small-zh —— M2
  "pymupdf>=1.23",            # PDF 解析 —— M2
  "markdown-it-py>=3.0",      # Markdown 解析 —— M2
]
mcp = [
  "mcp>=1.0",                 # MCP server（官方 SDK）—— M2
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
agentkernel = "agentkernel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
