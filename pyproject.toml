[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkernel"
version = "0.2.0"
description = "从零实现的 Agent Runtime 与 MCP 协议实验（不依赖任何 Agent 框架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",              # DeepSeek（OpenAI 兼容）—— M1 核心
  "python-dotenv>=1.0",       # .env —— M1 核心
]

[project.optional-dependencies]
mysql = [
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.13",
  # MySQL 8 caching_sha2_password / SSL 认证路径需要；CI 与生产环境统一装上，避免只在某些 auth 路径失败
  "cryptography>=42",
]
rag = [
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
  "pymupdf>=1.23",
]
# 轻量 PDF 解析依赖：CI 只装这个就能让 test_rag 的 PDF 用例真跑，不必引入 chromadb/torch
pdf = [
  "pymupdf>=1.23",
]
mcp = [
  "mcp>=1.0",                 # MCP server（官方 SDK）—— M2
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",   # G-30：先只出报告，阈值在后续 PR ratchet
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
agentkernel = "agentkernel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: 真实 API 调用（默认排除；用 make test-live 显式运行）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "BLE001",  # 边界层允许捕获兜底异常并转成可读错误
  "DTZ005",  # 演示用本地时间，不强制 UTC
  "ISC004",  # 多行隐式字符串拼接可读性
  "PIE810",  # 保持多个 startswith 分支清晰
  "PYI034",  # 兼容旧式 __enter__ 返回类型写法
  "S110",    # 审计失败等场景允许 try/except/pass
  "UP007",   # Union 与 X | Y 在 3.11 下等价
]

[tool.mypy]
python_version = "3.11"

[tool.coverage.run]
source = ["agentkernel"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "^\\s*\\.\\.\\.\\s*$",   # Protocol 的 ... 占位不是可执行代码
]
