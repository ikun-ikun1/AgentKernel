[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkernel"
version = "0.1.0"
description = "从零实现的 Agent Runtime 与 MCP 协议实验（不依赖任何 Agent 框架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",              # DeepSeek（OpenAI 兼容）—— M1 核心
  "python-dotenv>=1.0",       # .env —— M1 核心
]

[project.optional-dependencies]
mysql = [
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.13",
]
rag = [
  "chromadb>=0.4",
  "sentence-transformers>=2.2",
  "pymupdf>=1.23",
]
mcp = [
  "mcp>=1.0",                 # MCP server（官方 SDK）—— M2
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
agentkernel = "agentkernel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "BLE001",  # 边界层允许捕获兜底异常并转成可读错误
  "DTZ005",  # 演示用本地时间，不强制 UTC
  "ISC004",  # 多行隐式字符串拼接可读性
  "PIE810",  # 保持多个 startswith 分支清晰
  "PYI034",  # 兼容旧式 __enter__ 返回类型写法
  "S110",    # 审计失败等场景允许 try/except/pass
  "UP007",   # Union 与 X | Y 在 3.11 下等价
]

[tool.mypy]
python_version = "3.11"
