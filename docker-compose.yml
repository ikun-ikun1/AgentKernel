services:
  mysql:
    # G-45：8.0.46 + docker.io manifest digest（镜像站与 docker.io 同为内容寻址）
    image: docker.m.daocloud.io/library/mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: agentkernel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentkernel}
      MYSQL_USER: ${MYSQL_USER:-agentkernel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
    # 只绑本机回环，避免把 MySQL 暴露到局域网（P0-5）
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 不默认启动：docker compose --profile app up
  # 镜像只装 core + mysql（不含 rag）；AGENTKERNEL_DB_URL 必须指向 compose 内的 mysql
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11.15-slim@sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff}
    image: agentkernel:local
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true
    environment:
      AGENTKERNEL_DB_URL: ${AGENTKERNEL_DB_URL:?请设置 AGENTKERNEL_DB_URL（指向 compose 内的 mysql）}
      AGENTKERNEL_KB_DSN: ${AGENTKERNEL_DB_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
    command: ["python", "-m", "agentkernel", "--migrate"]
    restart: "no"

volumes:
  mysql_data:
