services:
  mysql:
    image: mysql:8.0
    container_name: agentkernel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agentkernel
      MYSQL_USER: agentkernel
      MYSQL_PASSWORD: agentkernel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uagentkernel", "-pagentkernel"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
