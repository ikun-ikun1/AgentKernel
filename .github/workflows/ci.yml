name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只读仓库内容；upload-artifact 不需要额外写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + format + type + test + eval (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # G-45：8.0.46 + docker.io manifest digest（GitHub runner 取得）
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: agentkernel_test
          MYSQL_USER: agentkernel
          MYSQL_PASSWORD: agentkernel-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uagentkernel -pagentkernel-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AGENTKERNEL_MYSQL_TEST_DSN: mysql+pymysql://agentkernel:agentkernel-ci-password@127.0.0.1:3306/agentkernel_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 校验 lock 未漂移
        run: uv lock --check

      - name: 安装锁定依赖
        run: uv sync --frozen --extra dev --extra mysql --extra pdf

      - name: make check
        shell: bash
        run: |
          set -euo pipefail
          make check 2>&1 | tee check.log

      - name: coverage（只报告，不设阈值）
        run: make coverage

      - name: 上传 coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: 强制 0 skip
        shell: bash
        run: |
          if grep -q 'SKIPPED' check.log; then
            echo "::error::pytest 报告了 skip；CI 要求 0 skip（MySQL DSN 或 pdf extra 缺失？）"
            grep 'SKIPPED' check.log
            exit 1
          fi

      - name: 上传 check 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log

  eval-minimal:
    name: eval（最小依赖：core + dev）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: 安装最小依赖
        run: uv sync --frozen --extra dev
      - name: eval（mock）
        run: make eval

  security:
    name: security（gitleaks + semgrep + pip-audit）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: 安装扫描工具（gitleaks 版本固定）
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          uv tool install semgrep
          uv tool install pip-audit

      - name: gitleaks + semgrep
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make security

      - name: pip-audit（lock 依赖）
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make audit

  docker:
    name: docker build + smoke（core+mysql，非 root）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentkernel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke（启动 + /quit，只证明能启动）
        shell: bash
        run: |
          set -euo pipefail
          printf '/quit\n' | docker run -i --rm agentkernel:ci \
            python -m agentkernel --db :memory: --kb-db :memory: --kb-backend lexical | tee smoke.log
          grep -q 'AgentKernel 已启动' smoke.log

      - name: 运行用户非 root
        run: test "$(docker run --rm agentkernel:ci id -u)" != "0"

      # 口径：与 `docker images` 显示的未压缩体积一致（inspect .Size 是压缩层大小，不能用）
      - name: 体积门禁（< 400MB）
        shell: bash
        run: |
          set -euo pipefail
          raw=$(docker images agentkernel:ci --format '{{.Size}}')
          case "$raw" in
            *GB) mb=$(awk -v v="${raw%GB}" 'BEGIN{printf "%d", v*1024}') ;;
            *MB) mb=${raw%MB} ;;
            *)   mb=0 ;;
          esac
          echo "image size: ${raw} (${mb}MB, budget 400MB)"
          if [ "${mb}" -gt 400 ]; then
            echo "::error::镜像体积 ${raw} 超过 400MB 预算（依赖膨胀？）"
            exit 1
          fi
