name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：只读仓库内容；upload-artifact 不需要额外写权限
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + format + type + test + eval (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        # 固定到 8.0.46（与本地验证版本一致）。
        # TODO(G-45): 补 @sha256 digest；本机无法访问 registry-1.docker.io，取不到 docker.io 的 digest。
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: agentkernel_test
          MYSQL_USER: agentkernel
          MYSQL_PASSWORD: agentkernel-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uagentkernel -pagentkernel-ci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AGENTKERNEL_MYSQL_TEST_DSN: mysql+pymysql://agentkernel:agentkernel-ci-password@127.0.0.1:3306/agentkernel_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true

      - name: 校验 lock 未漂移
        run: uv lock --check

      - name: 安装锁定依赖
        run: uv sync --frozen --extra dev --extra mysql --extra pdf

      - name: make check
        shell: bash
        run: |
          set -euo pipefail
          make check 2>&1 | tee check.log

      - name: 强制 0 skip
        shell: bash
        run: |
          if grep -q 'SKIPPED' check.log; then
            echo "::error::pytest 报告了 skip；CI 要求 0 skip（MySQL DSN 或 pdf extra 缺失？）"
            grep 'SKIPPED' check.log
            exit 1
          fi

      - name: 上传 check 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log

  eval-minimal:
    name: eval（最小依赖：core + dev）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: 安装最小依赖
        run: uv sync --frozen --extra dev
      - name: eval（mock）
        run: make eval

  docker:
    name: docker build + smoke（core+mysql，非 root）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: agentkernel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke（启动 + /quit，只证明能启动）
        shell: bash
        run: |
          set -euo pipefail
          printf '/quit\n' | docker run -i --rm agentkernel:ci \
            python -m agentkernel --db :memory: --kb-db :memory: --kb-backend lexical | tee smoke.log
          grep -q 'AgentKernel 已启动' smoke.log

      - name: 运行用户非 root
        run: test "$(docker run --rm agentkernel:ci id -u)" != "0"

      - name: 记录镜像体积
        run: |
          docker image inspect agentkernel:ci --format '{{.Size}}' \
            | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'
